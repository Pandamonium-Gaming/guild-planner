name: guild-planner-stack

services:
  db:
    image: postgres:16
    container_name: guild-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guild_planner
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guild_planner"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - guild_planner_db_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guild-planner-app-stack
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env.stack
    environment:
      NODE_ENV: production
      AUTH_DATABASE_URL: postgresql://postgres:postgres@db:5432/guild_planner
      DATABASE_URL: postgresql://postgres:postgres@db:5432/guild_planner

volumes:
  guild_planner_db_data:
